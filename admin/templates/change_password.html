{% extends "base.html" %}

{% block title %}{{ get_text('title_change_password') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card fade-in">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-key me-2"></i> {{ get_text('title_change_password') }}</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="/change_password" onsubmit="return validatePasswords()">
                    <div class="mb-3">
                        <label class="form-label">{{ get_text('current_password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input type="password" class="form-control" name="old_password" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ get_text('new_password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-key"></i>
                            </span>
                            <input type="password" class="form-control" id="new_password" name="new_password" required>
                        </div>
                        <small class="text-muted">{{ get_text('password_min_length') }}</small>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">{{ get_text('confirm_password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light">
                                <i class="bi bi-check-lg"></i>
                            </span>
                            <input type="password" class="form-control" id="confirm_password" required>
                        </div>
                        <small class="text-danger" id="passwordMatchError" style="display: none;">
                            {{ get_text('passwords_not_match') }}
                        </small>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> {{ get_text('btn_save') }}
                        </button>
                        <a href="/" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left"></i> {{ get_text('btn_back') }}
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
function validatePasswords() {
    const newPass = document.getElementById('new_password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const errorSpan = document.getElementById('passwordMatchError');

    if (newPass !== confirmPass) {
        errorSpan.style.display = 'block';
        return false;
    }

    if (newPass.length < 6) {
        alert("{{ get_text('password_min_length') }}");
        return false;
    }

    errorSpan.style.display = 'none';
    return true;
}
</script>
{% endblock %}
