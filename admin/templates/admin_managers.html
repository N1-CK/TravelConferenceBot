<!-- templates/admin_managers.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление менеджерами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-4">
    <h2><i class="bi bi-shield-lock"></i> Управление менеджерами</h2>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5>Добавить менеджера</h5>
                </div>
                <div class="card-body">
                    <form action="/admin_managers/add" method="POST">
                        <div class="mb-3">
                            <label>Логин</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label>Пароль</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="mb-3">
                            <label>Полное имя</label>
                            <input type="text" class="form-control" name="full_name">
                        </div>
                        <div class="mb-3">
                            <label>Группы доступа</label>
                            {% for group in groups %}
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="groups" value="{{ group.name }}">
                                <label class="form-check-label">{{ group.name }} - {{ group.description }}</label>
                            </div>
                            {% endfor %}
                        </div>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>Список менеджеров</h5>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Логин</th>
                                <th>Имя</th>
                                <th>Группы</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for manager in managers %}
                            <tr>
                                <td>{{ manager.id }}</td>
                                <td>{{ manager.username }}</td>
                                <td>{{ manager.full_name or '-' }}</td>
                                <td>{{ manager.groups|join(', ') }}</td>
                                <td>
                                    <button class="btn btn-sm btn-danger" onclick="deleteManager({{ manager.id }})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function deleteManager(id) {
    if (confirm('Удалить менеджера?')) {
        fetch(`/admin_managers/delete/${id}`, {method: 'POST'})
            .then(() => location.reload());
    }
}
</script>
</body>
</html>
