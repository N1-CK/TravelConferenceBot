{% extends "base.html" %}

{% block title %}{{ get_text('title_login') }}{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 fade-in">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="user-avatar mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
                        <i class="bi bi-shield-lock"></i>
                    </div>
                    <h3 class="fw-bold">{{ get_text('title_login') }}</h3>
                    <p class="text-muted">Travel Conference Bot Admin Panel</p>
                </div>
                
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">{{ get_text('username') }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person text-muted"></i>
                            </span>
                            <input type="text" class="form-control border-start-0 ps-0" 
                                   name="username" placeholder="{{ get_text('username') }}" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label">{{ get_text('password') }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-key text-muted"></i>
                            </span>
                            <input type="password" class="form-control border-start-0 ps-0" 
                                   name="password" placeholder="••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-box-arrow-in-right me-2"></i>{{ get_text('btn_submit') }}
                    </button>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center text-muted small">
                    <i class="bi bi-info-circle"></i> 
                    Для доступа обратитесь к администратору
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .min-vh-100 {
        min-height: 100vh;
    }
    .input-group-text {
        background-color: #f8f9fa;
    }
    .form-control:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
</style>
{% endblock %}
